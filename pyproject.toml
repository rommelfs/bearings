[project]
name = "bearings"
version = "0.1.0"
description = "Organization inventory, contact review, and evidence-led threat relevance"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "cryptography>=46,<51",
    "defusedxml>=0.7.1,<0.8",
    "Django>=5.2,<5.3",
    "http-message-signatures>=2.2,<3",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.2,<4",
    "social-auth-app-django>=7.2,<8",
    "univers>=32.0.1,<33",
]

[project.optional-dependencies]
production = [
    "gunicorn>=23,<26",
]

[dependency-groups]
dev = ["ruff>=0.12,<0.16"]

[tool.ruff]
line-length = 110
exclude = ["portal/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.19",
    "oauthlib>=4.0.1",
    "social-auth-core>=6.2,<7",
]
