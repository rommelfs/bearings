ServerName rt.bearings.test
FcgidInitialEnv RT_SITE_CONFIG /adapter/RT_SiteConfig.pm
FcgidInitialEnv RT_SITE_CONFIG_DIR /run/rt-config/site-config.d
FcgidPassHeader Authorization
FcgidMaxRequestLen 2097152
FcgidIOTimeout 45
FcgidConnectTimeout 20
FcgidMaxProcesses 6
LogFormat "%h %m %U %>s" rt_safe
ErrorLog /var/log/apache2/rt-error.log
LogLevel warn auth_openidc:warn
<Directory /usr/share/request-tracker5/libexec>
    Options +ExecCGI
    Require all granted
</Directory>
<Directory /adapter>
    Options +ExecCGI
    Require all granted
</Directory>
<VirtualHost *:443>
    ServerName rt.bearings.test
    SSLEngine On
    SSLCertificateFile /run/tls/rt.crt
    SSLCertificateKeyFile /run/tls/rt.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    CustomLog /var/log/apache2/rt-access.log rt_safe
    ScriptAlias / /usr/share/request-tracker5/libexec/rt-server.fcgi/
    # SSO_INCLUDE
    <Location /REST/1.0/NoAuth>
        Require all denied
    </Location>
</VirtualHost>
# This listener is published only on host loopback and deliberately keeps local recovery.
<VirtualHost *:444>
    ServerName localhost
    SSLEngine On
    SSLCertificateFile /run/tls/rt.crt
    SSLCertificateKeyFile /run/tls/rt.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    CustomLog /var/log/apache2/rt-recovery-access.log rt_safe
    ScriptAlias / /adapter/recovery.fcgi/
    <Location /REST/1.0/NoAuth>
        Require all denied
    </Location>
</VirtualHost>
