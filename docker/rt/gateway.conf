# Edge remains on the normal lab network; RT itself has no Internet route.
server {
    listen 445 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/rt/rt.crt;
    ssl_certificate_key /etc/nginx/rt/rt.key;
    access_log off;
    error_log /dev/null;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=5s;
    location / {
        set $rt_backend rt;
        proxy_pass https://$rt_backend:443;
        proxy_ssl_server_name on;
        proxy_ssl_name rt.bearings.test;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/rt/ca.crt;
        proxy_set_header Host $http_host;
    }
}
