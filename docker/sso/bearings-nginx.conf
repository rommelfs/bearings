log_format canvas_safe '$remote_addr $request_method $uri $status';
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/netbox.crt;
    ssl_certificate_key /etc/nginx/certs/netbox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log canvas_safe;
    error_log /dev/null;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=5s;
    location / {
        set $bearings_backend web;
        proxy_pass http://$bearings_backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
