log_format sso_safe '$remote_addr $request_method $uri $status';
include /etc/nginx/conf.d/canvas-policy.inc;
server {
    listen 443 ssl;
    server_name netbox.bearings.test localhost host.docker.internal;
    ssl_certificate /etc/nginx/certs/netbox.crt;
    ssl_certificate_key /etc/nginx/certs/netbox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    access_log /var/log/nginx/access.log sso_safe;
    location / {
        proxy_pass http://netbox:8080;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy $netbox_frame_ancestors always;
        add_header X-Frame-Options $netbox_frame_options always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
# Canonical browser issuer uses localhost; backends use this certificate-verified internal listener.
server {
    listen 444 ssl;
    server_name netbox.bearings.test localhost;
    ssl_certificate /etc/nginx/certs/netbox.crt;
    ssl_certificate_key /etc/nginx/certs/netbox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off; # OIDC codes, state and session cookies must not enter access logs.
    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
