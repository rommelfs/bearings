log_format flowintel_safe '$remote_addr $request_method $uri $status';
server {
    listen 443 ssl;
    server_name flowintel.bearings.test localhost;
    ssl_certificate /etc/nginx/certs/flowintel.crt;
    ssl_certificate_key /etc/nginx/certs/flowintel.key;
    client_max_body_size 2m;
    access_log /var/log/nginx/access.log flowintel_safe;
    location = /bearings-sso/callback {
        # Nginx upstream error messages otherwise include the original query string.
        error_log /dev/null;
        proxy_pass http://flowintel:7006;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://flowintel:7006;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
