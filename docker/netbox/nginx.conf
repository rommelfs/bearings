# Re-resolve fixed Docker service names when an application container is replaced.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
server {
    listen 443 ssl;
    server_name netbox.bearings.test localhost host.docker.internal;
    ssl_certificate /etc/nginx/certs/netbox.crt;
    ssl_certificate_key /etc/nginx/certs/netbox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    location / {
        set $netbox_backend netbox;
        proxy_pass http://$netbox_backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
