services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bearings
      POSTGRES_USER: bearings
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bearings -d bearings"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: local-development-only-not-for-deployment
      DATABASE_URL: postgresql://bearings:local-development-only@db:5432/bearings
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - local-data:/app/.local
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  local-data:
