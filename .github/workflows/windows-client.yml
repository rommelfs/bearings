name: Windows client updates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-windows-updater:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: clients/windows/go.sum
      - name: Verify synthetic updater and DPAPI state on Windows
        run: go test -count=1 -v -run 'TestSelfUpdate|TestNativeProtectedStateAndLock' ./...
      - run: go vet ./...
  portable-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: clients/windows/go.sum
      - run: go test -race ./...
        working-directory: clients/windows
      - run: go vet ./...
        working-directory: clients/windows
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/test_windows_release.py
