name: Development stack
on:
  workflow_dispatch:
  push:
    paths:
      - 'compose*.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'scripts/dev.py'
      - 'scripts/sso_smoke.py'
      - 'scripts/rt_sso.py'
      - 'scripts/flowintel_source.py'
      - 'portal/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/dev-stack.yml'
  pull_request:
    paths:
      - 'compose*.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'scripts/dev.py'
      - 'scripts/sso_smoke.py'
      - 'scripts/rt_sso.py'
      - 'scripts/flowintel_source.py'
      - 'portal/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/dev-stack.yml'
permissions:
  contents: read
jobs:
  bundled:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - flowintel: false
            sso: false
          - flowintel: true
            sso: false
          - flowintel: false
            sso: true
          - flowintel: true
            sso: true
    steps:
      - uses: actions/checkout@v4
      - name: Start real Bearings and NetBox
        run: python3 scripts/dev.py up ${{ matrix.flowintel && '--flowintel' || '--no-flowintel' }} ${{ matrix.sso && '--sso' || '--no-sso' }} --timeout 900
      - name: Exercise HTTPS, scoped queries, portal writes and recovery
        run: python3 scripts/dev.py smoke
      - name: Verify FlowIntel session isolation and revocation in its pinned runtime
        if: matrix.flowintel
        run: docker exec -i bearings-dev-flowintel-1 /home/flowintel/venv/bin/python - < docker/flowintel/test_sso.py
      - name: Verify real OIDC and tenant-isolated NetBox access
        if: matrix.sso
        run: python3 scripts/dev.py sso-smoke
      - name: Prepare bounded synthetic lifecycle and exposure exercise
        run: python3 scripts/dev.py manage seed_asset_issues --bundled
      - name: Stop without deleting data
        run: python3 scripts/dev.py down
      - name: Restart retained volumes and query
        run: |
          python3 scripts/dev.py up --no-build --timeout 300
          python3 scripts/dev.py query
          python3 scripts/dev.py manage seed_asset_issues --bundled
      - name: Verify retained SSO realm and account bindings
        if: matrix.sso
        run: python3 scripts/dev.py sso-smoke
      - name: Verify retained FlowIntel cases and task identities
        if: matrix.flowintel
        run: python3 scripts/dev.py smoke
      - name: Capture failure logs without credentials
        if: failure()
        run: docker compose -p bearings-dev -f compose.dev.yaml -f compose.netbox.yaml -f compose.flowintel.yaml -f compose.sso.yaml -f compose.flowintel-sso.yaml logs --no-color > dev-stack.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-stack-logs-${{ matrix.flowintel }}-${{ matrix.sso }}
          path: dev-stack.log
      - name: Stop test containers
        if: always()
        run: python3 scripts/dev.py down
