name: Development stack
on:
  workflow_dispatch:
  push:
    paths:
      - 'compose*.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'clients/linux/**'
      - 'scripts/linux_installer_smoke.py'
      - 'scripts/build_linux_client.py'
      - 'scripts/dev.py'
      - 'scripts/sso_smoke.py'
      - 'scripts/flowintel_browser_smoke.py'
      - 'scripts/rt_sso.py'
      - 'scripts/rt_local_smoke.py'
      - 'scripts/flowintel_source.py'
      - 'portal/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/dev-stack.yml'
  pull_request:
    paths:
      - 'compose*.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'clients/linux/**'
      - 'scripts/linux_installer_smoke.py'
      - 'scripts/build_linux_client.py'
      - 'scripts/dev.py'
      - 'scripts/sso_smoke.py'
      - 'scripts/flowintel_browser_smoke.py'
      - 'scripts/rt_sso.py'
      - 'scripts/rt_local_smoke.py'
      - 'scripts/flowintel_source.py'
      - 'portal/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/dev-stack.yml'
permissions:
  contents: read
jobs:
  bundled:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - flowintel: false
            sso: false
            rt: false
          - flowintel: true
            sso: false
            rt: false
          - flowintel: false
            sso: true
            rt: false
          - flowintel: true
            sso: true
            rt: false
          - flowintel: true
            sso: true
            rt: true
          - flowintel: false
            sso: false
            rt: true
          - flowintel: true
            sso: true
            rt: true
            rtir: true
    steps:
      - uses: actions/checkout@v4
      - name: Start real Bearings and NetBox
        run: python3 scripts/dev.py up ${{ matrix.flowintel && '--flowintel' || '--no-flowintel' }} ${{ matrix.sso && '--sso' || '--no-sso' }} ${{ matrix.rt && '--rt' || '--no-rt' }} ${{ matrix.rtir && '--rtir' || '' }} --timeout 900
      - uses: actions/setup-go@v5
        if: matrix.rtir
        with:
          go-version: "1.27.4"
          cache: false
      - name: Verify current and Python 3.8 installers with noexec runtime storage
        if: matrix.rtir
        run: |
          python3 scripts/build_linux_client.py
          python3 scripts/linux_installer_smoke.py
          python3 scripts/linux_installer_smoke.py --python38
      - name: Exercise HTTPS, scoped queries, portal writes and recovery
        run: python3 scripts/dev.py smoke
      - name: Verify native NetBox SSO linking without the Django admin app
        run: python3 scripts/check_netbox_native_link.py
      - name: Verify FlowIntel session isolation and revocation in its pinned runtime
        if: matrix.flowintel
        run: docker exec -i bearings-dev-flowintel-1 /home/flowintel/venv/bin/python - < docker/flowintel/test_sso.py
      - name: Verify real RT queue permissions and local-only mail
        if: matrix.rt
        run: docker exec bearings-dev-rt-1 python3 /adapter/start.py smoke
      - name: Verify real OIDC and tenant-isolated NetBox access
        if: matrix.sso
        run: python3 scripts/dev.py sso-smoke
      - uses: astral-sh/setup-uv@v6
        if: matrix.flowintel && matrix.sso
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Verify actual Chromium and WebKit form redirects and FlowIntel SSO
        if: matrix.flowintel && matrix.sso
        run: |
          uv venv /tmp/bearings-browser-checks --python 3.12
          uv pip install --python /tmp/bearings-browser-checks/bin/python playwright==1.62.0
          /tmp/bearings-browser-checks/bin/python -m playwright install --with-deps chromium webkit
          /tmp/bearings-browser-checks/bin/python scripts/flowintel_browser_smoke.py --browser chromium
          /tmp/bearings-browser-checks/bin/python scripts/flowintel_browser_smoke.py --browser webkit
      - name: Verify real RT local password path
        if: matrix.rt && !matrix.sso
        run: python3 scripts/dev.py rt-local-smoke
      - name: Prepare bounded synthetic lifecycle and exposure exercise
        run: python3 scripts/dev.py manage seed_asset_issues --bundled
      - name: Stop without deleting data
        run: python3 scripts/dev.py down
      - name: Restart retained volumes and query
        run: |
          python3 scripts/dev.py up --no-build --timeout 300
          python3 scripts/dev.py query
          python3 scripts/dev.py manage seed_asset_issues --bundled
      - name: Verify retained SSO realm and account bindings
        if: matrix.sso
        run: python3 scripts/dev.py sso-smoke
      - name: Verify retained RT local login
        if: matrix.rt && !matrix.sso
        run: python3 scripts/dev.py rt-local-smoke
      - name: Verify retained RT hand-off identities
        if: matrix.rt
        run: python3 scripts/dev.py smoke
      - name: Verify retained FlowIntel cases and task identities
        if: matrix.flowintel
        run: python3 scripts/dev.py smoke
      - name: Capture failure logs without credentials
        if: failure()
        run: docker compose -p bearings-dev -f compose.dev.yaml -f compose.netbox.yaml -f compose.flowintel.yaml -f compose.sso.yaml -f compose.flowintel-sso.yaml -f compose.rt.yaml -f compose.rt-sso.yaml -f compose.rtir.yaml logs --no-color > dev-stack.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-stack-logs-${{ matrix.flowintel }}-${{ matrix.sso }}-${{ matrix.rt }}-${{ matrix.rtir }}
          path: dev-stack.log
      - name: Stop test containers
        if: always()
        run: python3 scripts/dev.py down
