name: Development stack
on:
  workflow_dispatch:
  push:
    paths:
      - 'compose*.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'scripts/dev.py'
      - 'scripts/flowintel_source.py'
      - 'portal/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/dev-stack.yml'
  pull_request:
    paths:
      - 'compose*.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'scripts/dev.py'
      - 'scripts/flowintel_source.py'
      - 'portal/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/dev-stack.yml'
permissions:
  contents: read
jobs:
  bundled:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flowintel: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Start real Bearings and NetBox
        run: python3 scripts/dev.py up ${{ matrix.flowintel && '--flowintel' || '--no-flowintel' }} --timeout 900
      - name: Exercise HTTPS, scoped queries, portal writes and recovery
        run: python3 scripts/dev.py smoke
      - name: Stop without deleting data
        run: python3 scripts/dev.py down
      - name: Restart retained volumes and query
        run: |
          python3 scripts/dev.py up --no-build --timeout 300
          python3 scripts/dev.py query
      - name: Verify retained FlowIntel cases and task identities
        if: matrix.flowintel
        run: python3 scripts/dev.py smoke
      - name: Capture failure logs without credentials
        if: failure()
        run: docker compose -p bearings-dev -f compose.dev.yaml -f compose.netbox.yaml -f compose.flowintel.yaml logs --no-color > dev-stack.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-stack-logs-${{ matrix.flowintel }}
          path: dev-stack.log
      - name: Stop test containers
        if: always()
        run: python3 scripts/dev.py down
