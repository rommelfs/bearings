# Include once from /etc/nginx/sites-enabled; no query strings in access logs.
limit_req_zone $binary_remote_addr zone=bearings_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bearings_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=bearings_agent:10m rate=10r/s;
log_format bearings_privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream bearings_app { server unix:/run/bearings/web.sock; }
server {
    listen 80;
    listen [::]:80;
    server_name bearings.circl.lu;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://bearings.circl.lu$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bearings.circl.lu;
    ssl_certificate /etc/letsencrypt/live/bearings.circl.lu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bearings.circl.lu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != bearings.circl.lu) { return 444; }
    client_max_body_size 1m;
    limit_req_status 429;
    access_log /var/log/nginx/bearings-access.log bearings_privacy;
    error_log /var/log/nginx/bearings-error.log warn;
    location /static/ { alias /var/www/bearings/static/; }
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 65s;
    proxy_redirect off;
    location = /accounts/login/ { limit_req zone=bearings_login burst=5 nodelay; proxy_pass http://bearings_app; }
    location = /admin/login/ { limit_req zone=bearings_login burst=5 nodelay; proxy_pass http://bearings_app; }
    location ^~ /accounts/ { limit_req zone=bearings_login burst=5 nodelay; proxy_pass http://bearings_app; }
    location ^~ /register/ { limit_req zone=bearings_register burst=10 nodelay; proxy_pass http://bearings_app; }
    location ^~ /api/v1/agent/ { limit_req zone=bearings_agent burst=30 nodelay; proxy_pass http://bearings_app; }
    location / { proxy_pass http://bearings_app; }
}
