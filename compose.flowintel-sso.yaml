# Selected automatically only when both --flowintel and --sso are enabled.
services:
  dev-init:
    environment:
      FLOWINTEL_PORT: ${FLOWINTEL_PORT:-9443}
    volumes:
      - flowintel-sso:/state/flowintel-sso
  flowintel-sso-provision:
    image: bearings-development
    user: root
    command: ["/app/.venv/bin/python", "/adapter/provision-client.py"]
    volumes:
      - ./docker/sso/provision_client.py:/adapter/provision-client.py:ro
      - sso-secrets:/run/idp:ro
      - flowintel-sso:/run/flowintel-sso:ro
    depends_on:
      netbox-tls:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  flowintel-init: &sso-flowintel
    environment:
      BEARINGS_FLOWINTEL_SSO: "1"
      SSO_PORT: ${SSO_PORT:-9444}
      NO_PROXY: localhost,127.0.0.1,netbox.bearings.test
    volumes:
      - flowintel-sso:/run/sso:ro
    depends_on:
      flowintel-sso-provision:
        condition: service_completed_successfully
  flowintel:
    <<: *sso-flowintel
volumes:
  flowintel-sso:
