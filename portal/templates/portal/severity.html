<a class="severity-badge severity-{{ finding.severity_key }}" href="{% url 'intelligence' finding.organization.slug %}?finding={{ finding.pk }}#evidence-{{ finding.pk }}" aria-label="Source severity {{ finding.source_summary.severity }}; read vulnerability evidence">{{ finding.source_summary.severity }}{% if finding.source_summary.score != None %}<span class="severity-score"><strong>{{ finding.source_summary.score }}</strong><small>CVSS {{ finding.source_summary.cvss_version }}</small></span>{% else %}<span>Score missing</span>{% endif %}</a>
