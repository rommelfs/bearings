{% firstof org.slug request.GET.organization as client_organization %}
{% if sidebar %}<div class="nav-client-platforms" role="navigation" aria-label="Inventory clients">{% else %}<nav class="client-platform-links" aria-label="Inventory clients">{% endif %}
  <a{% if not sidebar %} class="button"{% endif %} href="{% url 'linux-client-downloads' %}{% if client_organization %}?organization={{ client_organization|urlencode }}{% endif %}"{% if platform == 'linux' or request.resolver_match.url_name == 'linux-client-downloads' %} aria-current="page"{% endif %}>Linux</a>
  <a{% if not sidebar %} class="button"{% endif %} href="{% url 'windows-client-downloads' %}{% if client_organization %}?organization={{ client_organization|urlencode }}{% endif %}"{% if platform == 'windows' or request.resolver_match.url_name == 'windows-client-downloads' %} aria-current="page"{% endif %}>Windows</a>
  <a{% if not sidebar %} class="button"{% endif %} href="{% url 'client-rollouts' %}{% if client_organization %}?organization={{ client_organization|urlencode }}{% endif %}"{% if platform == 'rollouts' or request.resolver_match.url_name == 'agent-fleets' or request.resolver_match.url_name == 'client-rollouts' %} aria-current="page"{% endif %}>Rollout keys</a>
  <a{% if not sidebar %} class="button"{% endif %} href="{% url 'client-profiles' %}{% if client_organization %}?organization={{ client_organization|urlencode }}{% endif %}"{% if platform == 'profiles' or request.resolver_match.url_name == 'application-profiles' or request.resolver_match.url_name == 'client-profiles' %} aria-current="page"{% endif %}>Profiles</a>
{% if sidebar %}</div>{% else %}</nav>{% endif %}
