<article><p class="eyebrow">{{ org.slug }} · #{{ org.pk }}</p><h2><a href="{% url 'organization' org.slug %}">{{ org.name }}</a></h2><div class="metrics"><div><strong>{{ org.asset_count }}</strong><a href="{% url 'organization' org.slug %}#inventory">Assets</a></div><div><strong>{{ org.finding_count }}</strong><a href="{% url 'intelligence' org.slug %}">Open reviews</a></div><div><strong>{{ org.overdue_count }}</strong><a href="{% url 'organization' org.slug %}#contacts">Contacts due</a></div></div><p class="muted">Source: {% if org.inventory_source %}{{ org.inventory_source.get_mode_display }}{% else %}Not configured{% endif %}</p><div class="actions"><a class="button primary" href="{% url 'organization' org.slug %}#inventory">Open inventory →</a><a class="button" href="{% url 'organization' org.slug %}#contacts">People & scope</a></div></article>
